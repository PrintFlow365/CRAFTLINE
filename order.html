<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order - CRAFTLINE</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main>

        <div id="orderDetails">

            <p>Loading order...</p>

        </div>

    </main>


    <script type="module">

        import { db } from "./js/firebase-config.js";

        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        async function loadOrderProduct(){

            try{

                const params =
                    new URLSearchParams(window.location.search);

                const productId =
                    params.get("product");


                const container =
                    document.getElementById("orderDetails");


                if(!productId){

                    container.innerHTML =
                        "<p>Product not found.</p>";

                    return;

                }


                const productRef =
                    doc(db, "products", productId);


                const productSnap =
                    await getDoc(productRef);


                if(!productSnap.exists()){

                    container.innerHTML =
                        "<p>Product not found.</p>";

                    return;

                }


                const product =
                    productSnap.data();


                let imageHTML = "";


                if(
                    product.images &&
                    product.images.length > 0
                ){

                    imageHTML = `

                        <img
                            src="images/${product.images[0]}"
                            alt="${product.productName || ""}"
                            class="product-image"
                        >

                    `;

                }


                container.innerHTML = `

                    <div class="product-card">

                        ${imageHTML}

                        <h1>
                            Order / Request Quote
                        </h1>


                        <h2>
                            ${product.productName || ""}
                        </h2>


                        <p>
                            Category:
                            ${product.category || ""}
                        </p>


                        <p>
                            Subcategory:
                            ${product.subcategory || ""}
                        </p>


                        <label>
                            Quantity
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            min="1"
                            value="1"
                            style="width:100%; padding:12px; margin:8px 0 15px;"
                        >


                        <label>
                            Additional Requirements
                        </label>

                        <textarea
                            id="requirements"
                            rows="5"
                            placeholder="Write your requirements..."
                            style="width:100%; padding:12px; margin:8px 0 15px;"
                        ></textarea>


                        <button
                            id="submitOrderBtn"
                            class="btn"
                            style="width:100%;"
                        >
                            Submit Request
                        </button>


                        <a
                            href="index.html"
                            style="display:block; margin-top:15px;"
                        >
                            ← Back to Home
                        </a>

                    </div>

                `;


                document
                    .getElementById("submitOrderBtn")
                    .addEventListener("click", function(){

                        const quantity =
                            document.getElementById("quantity").value;

                        const requirements =
                            document.getElementById("requirements").value;


                        alert(
                            "Order request received for " +
                            product.productName +
                            "\\nQuantity: " +
                            quantity
                        );

                    });


            }catch(error){

                console.log(
                    "Order error:",
                    error
                );


                document.getElementById(
                    "orderDetails"
                ).innerHTML =
                    "<p>Unable to load order page.</p>";

            }

        }


        loadOrderProduct();

    </script>

</body>

</html>
